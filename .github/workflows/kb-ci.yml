name: KB CI

# 知识库静态校验：链接完整性 / 仓库卫生 / 索引漂移 / README 状态
# 本仓库无法构建 C#（无游戏程序集），CI 仅做知识库与结构层面的验收门槛。
on:
  push:
  pull_request:

jobs:
  kb-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 链接完整性（必须通过）
        run: python tools/kb/check_links.py

      - name: 仓库卫生（.bak / 跟踪 PDB / 目录命名）
        run: python tools/kb/check_repo_hygiene.py

      - name: 索引漂移检测（mod 改动后须重跑 scan_mods.py）
        run: python tools/kb/scan_mods.py --check

      - name: README 占位检测
        run: python tools/kb/validate_readme.py --todo
