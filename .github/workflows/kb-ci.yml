name: KB CI

# 知识库静态校验：链接完整性 / 仓库卫生 / 索引漂移 / README 状态
# 本仓库无法构建 C#（无游戏程序集），CI 仅做知识库与结构层面的验收门槛。
on:
  push:
  pull_request:

jobs:
  kb-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 链接完整性（必须通过）
        run: python tools/kb/check_links.py

      - name: 仓库卫生（.bak / 跟踪 PDB / 目录命名）
        run: python tools/kb/check_repo_hygiene.py

      - name: 索引漂移检测（mod 改动后须重跑 scan_mods.py）
        run: python tools/kb/scan_mods.py --check

      - name: README 占位检测
        run: python tools/kb/validate_readme.py --todo

      - name: 诊断索引差异（临时，诊断后移除）
        if: failure()
        run: |
          python tools/kb/scan_mods.py --json-only
          python - <<'PY'
          import json, os, subprocess, urllib.request
          head = subprocess.run(['git','show','HEAD:docs/knowledge/kb-index.json'],
                                capture_output=True, text=True, encoding='utf-8')
          prev = {m['dir']: m for m in json.loads(head.stdout)}
          cur = {m['dir']: m for m in json.load(open('docs/knowledge/kb-index.json', encoding='utf-8'))}
          fields = ('number','category','type','versions','readme_status','has_languages',
                    'has_docs','has_tests','has_csharp','has_agents','has_publisher_plus',
                    'has_loadfolders','has_loadfolders_bak','has_common','in_backup')
          lines = []
          for d in sorted(set(prev) | set(cur)):
              if d not in cur:
                  lines.append(f'[removed in scan] {d}')
              elif d not in prev:
                  lines.append(f'[added in scan] {d}')
              else:
                  for f in fields:
                      if prev[d].get(f) != cur[d].get(f):
                          lines.append(f'  {d}.{f}: HEAD={prev[d].get(f)!r} -> SCAN={cur[d].get(f)!r}')
          body = 'CI scan check diff (autogenerated):\n\n' + ('\n'.join(lines) if lines else '(no field diff but non-zero exit)')
          req = urllib.request.Request(
              'https://api.github.com/repos/Makeshiftname/rimworld-RimModNotes/issues',
              data=json.dumps({'title': 'CI 诊断: scan check diff', 'body': body}).encode(),
              method='POST',
              headers={'Authorization': f'Bearer {os.environ["GITHUB_TOKEN"]}',
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json', 'User-Agent': 'kb-diag'})
          try:
              print('issue status:', urllib.request.urlopen(req).status)
          except Exception as e:
              print('issue create failed:', e)
